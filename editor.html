<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editor - MyHost</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background: #080b18;

            color: white;

            font-family: Arial, sans-serif;

            height: 100vh;

            overflow: hidden;
        }

        header {
            height: 65px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 18px;

            border-bottom: 1px solid #20253d;
        }

        .left {
            display: flex;

            align-items: center;

            gap: 15px;
        }

        .logo {
            font-size: 21px;

            font-weight: bold;
        }

        .logo span {
            color: #7057ff;
        }

        #projectName {
            color: #969db5;
        }

        .actions {
            display: flex;

            gap: 8px;
        }

        button {
            border: 0;

            border-radius: 8px;

            padding: 9px 15px;

            color: white;

            background: #171c31;

            cursor: pointer;
        }

        .publish {
            background: #7057ff;
        }

        .editor {
            height: calc(100vh - 65px);

            display: grid;

            grid-template-columns: 1fr 1fr;
        }

        .code-area {
            display: flex;

            flex-direction: column;

            border-right: 1px solid #20253d;

            min-width: 0;
        }

        .tabs {
            display: flex;

            border-bottom: 1px solid #20253d;

            background: #0c1020;
        }

        .tab {
            padding: 12px 18px;

            color: #9298af;

            cursor: pointer;
        }

        .tab.active {
            color: white;

            background: #11162a;
        }

        textarea {
            flex: 1;

            width: 100%;

            resize: none;

            outline: none;

            border: 0;

            padding: 20px;

            background: #0b0f20;

            color: #e8e9ef;

            font-family: monospace;

            font-size: 14px;

            line-height: 1.6;
        }

        iframe {
            width: 100%;

            height: 100%;

            border: 0;

            background: white;
        }

        @media (max-width: 800px) {

            .editor {
                grid-template-columns: 1fr;
            }

            iframe {
                display: none;
            }

        }

    </style>

</head>


<body>

<header>

    <div class="left">

        <div class="logo">
            My<span>Host</span>
        </div>

        <div id="projectName">
            New Website
        </div>

    </div>


    <div class="actions">

        <button onclick="goDashboard()">
            Dashboard
        </button>

        <button onclick="saveProject()">
            Save
        </button>

        <button
            class="publish"
            onclick="publishProject()"
        >
            🚀 Publish
        </button>

    </div>

</header>


<div class="editor">

    <section class="code-area">

        <div class="tabs">

            <div
                class="tab active"
                data-tab="html"
                onclick="switchTab('html')"
            >
                HTML
            </div>

            <div
                class="tab"
                data-tab="css"
                onclick="switchTab('css')"
            >
                CSS
            </div>

            <div
                class="tab"
                data-tab="javascript"
                onclick="switchTab('javascript')"
            >
                JavaScript
            </div>

        </div>


        <textarea
            id="code"
            spellcheck="false"
        ></textarea>

    </section>


    <iframe
        id="preview"
        sandbox="allow-scripts"
    ></iframe>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="editor.js"></script>

</body>

</html>
