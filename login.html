<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - MyHost</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #080b18;

            color: white;

            font-family: Arial;
        }

        .card {
            width: 100%;

            max-width: 430px;

            padding: 35px;

            background: #11162a;

            border: 1px solid #20253d;

            border-radius: 18px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #969db5;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-top: 12px;

            border: 1px solid #2b324c;

            border-radius: 9px;

            background: #0a0f20;

            color: white;

            outline: none;
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 18px;

            border: 0;

            border-radius: 9px;

            background: #7057ff;

            color: white;

            cursor: pointer;

            font-size: 16px;
        }

        #message {
            margin-top: 15px;
        }

        a {
            color: #9182ff;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>
        Welcome back
    </h1>

    <p>
        Login to your MyHost account.
    </p>


    <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Email"
    >


    <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
    >


    <button onclick="login()">
        Login
    </button>


    <p id="message"></p>


    <p>
        Don't have an account?
        <a href="signup.html">
            Create one
        </a>
    </p>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

async function login() {

    const email =
        document.getElementById("email")
            .value
            .trim();

    const password =
        document.getElementById("password")
            .value;

    const message =
        document.getElementById("message");


    if (!email || !password) {

        message.textContent =
            "Please enter your email and password.";

        return;
    }


    message.textContent =
        "Logging in...";


    const {
        data,
        error
    } =
        await supabaseClient.auth
            .signInWithPassword({

                email: email,

                password: password

            });


    if (error) {

        message.textContent =
            error.message;

        return;
    }


    window.location.href =
        "dashboard.html";

}

</script>

</body>

</html>
