<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - MyHost</title>

    <link
        rel="stylesheet"
        href="dashboard.css"
    >

</head>

<body>

<header>

    <div class="logo">
        My<span>Host</span>
    </div>

    <div class="header-right">

        <span id="userEmail"></span>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</header>


<main>

    <div class="dashboard-title">

        <div>

            <p class="small">
                Dashboard
            </p>

            <h1>
                Your Websites
            </h1>

        </div>


        <button
            class="create"
            onclick="createWebsite()"
        >
            + Create Website
        </button>

    </div>


    <div
        id="projects"
        class="projects"
    >

        <div class="loading">
            Loading websites...
        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="dashboard.js"></script>

</body>

</html>
